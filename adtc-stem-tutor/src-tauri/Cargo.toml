[package]
name = "adtc-stem-tutor"
version = "0.1.0"
description = "Localized STEM Virtual Lab Tutor Desktop Boilerplate"
authors = ["Deep Tech Challenge 2026 Team"]
edition = "2021"

[lib]
name = "adtc_stem_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 dependencies
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.0.0"

# Serialization and async runtime
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }

# Low-level llama.cpp bindings (Safe wrapper around C++ llama.cpp)
# Requires cmake and clang/build-essential installed locally to compile GGML FFI bindings.
llama-cpp-2 = "0.1.143"

# Override optimizations specifically for development dependencies
[profile.dev.package."*"]
opt-level = 3

# Force the underlying llama-cpp bindings to compile with full speed in dev mode
[profile.dev.package.llama-cpp-2]
opt-level = 3

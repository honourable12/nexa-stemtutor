[package]
name = "adtc-stem-tutor"
version = "0.1.0"
description = "Localized STEM Virtual Lab Tutor Desktop Boilerplate"
authors = ["honourable12"]
edition = "2021"

[lib]
name = "adtc_stem_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 dependencies
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.0.0"

# Serialization and async runtime
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }

llama-cpp-2 = "0.1.150"

num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.llama-cpp-2]
opt-level = 3

[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
